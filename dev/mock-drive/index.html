<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music - Google Drive</title>
<!--
  Mock Google Drive folder for testing the userscript without a real account.

  Serve the repository root and open:
    python3 -m http.server 8765
    http://127.0.0.1:8765/dev/mock-drive/index.html

  Query parameters:
    total=172        number of MP3/WebM tracks in the folder
    extra=6          non-media files mixed in (jpg/txt)
    batch=50         rows Drive appends per lazy-load batch
    delay=400-1800   random network delay per batch, in ms
    render=40        delay before virtual rows are re-rendered after a scroll
    spinner=1        show a role="progressbar" row while a batch loads
    theme=light|dark page background colour
    broken=3         number of tracks whose download URL fails (simulates deleted files)
    virtual=0        keep every loaded row in the DOM instead of virtualizing
    script=path      userscript to inject (default: the repo's main script)
-->
<style>
  :root { --bg: #f8fafd; --text: #1f1f1f; --line: #e3e3e3; }
  body.dark { --bg: #1b1b1b; --text: #e3e3e3; --line: #333; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; display: grid; grid-template-rows: 64px 1fr; grid-template-columns: 240px 1fr; }
  header { grid-column: 1 / 3; display: flex; align-items: center; padding: 0 20px; font-size: 20px; border-bottom: 1px solid var(--line); }
  nav { padding: 16px; opacity: .7; }
  main { display: flex; flex-direction: column; min-height: 0; }
  .crumbs { padding: 14px 16px; font-size: 22px; }
  #scroller { flex: 1; overflow-y: auto; position: relative; min-height: 0; }
  #spacer { position: relative; }
  [role="row"] { position: absolute; left: 0; right: 0; height: 48px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--line); box-sizing: border-box; }
  [role="progressbar"] { position: absolute; left: 0; right: 0; height: 48px; display: flex; align-items: center; justify-content: center; opacity: .7; }
  #stats { position: fixed; left: 8px; bottom: 8px; font: 11px monospace; opacity: .7; }
</style>
</head>
<body>
<header>Drive (mock)</header>
<nav>My Drive<br>Shared with me<br>Recent</nav>
<main>
  <div class="crumbs">My Drive › Music</div>
  <div id="scroller" role="grid"><div id="spacer"></div></div>
</main>
<div id="stats"></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const TOTAL = Number(params.get('total') || 172);
  const EXTRA = Number(params.get('extra') || 6);
  const BATCH = Number(params.get('batch') || 50);
  const [DELAY_MIN, DELAY_MAX] = (params.get('delay') || '400-1800').split('-').map(Number);
  const RENDER_DELAY = Number(params.get('render') || 40);
  const SPINNER = params.get('spinner') !== '0';
  const BROKEN = Number(params.get('broken') || 0);
  const VIRTUAL = params.get('virtual') !== '0';
  const ROW_H = 48;
  if (params.get('theme') === 'dark') document.body.classList.add('dark');

  // Deterministic folder content: tracks plus a few non-media files.
  const words = ['Morning', 'Rain', 'City', 'Lights', 'Ocean', 'Drive', 'Echo', 'Velvet', 'Summer', 'Night', 'Paper', 'Moon', 'Café', 'Été', '晚风', '星空'];
  const all = [];
  for (let i = 0; i < TOTAL; i += 1) {
    const ext = i % 11 === 7 ? 'webm' : 'mp3';
    const name = `${String(i + 1).padStart(3, '0')} - ${words[i % words.length]} ${words[(i * 7) % words.length]}.${ext}`;
    const broken = i >= TOTAL - BROKEN ? 'X' : '';
    all.push({ id: `mockid${String(i).padStart(6, '0')}${broken}AbC`, name });
  }
  for (let i = 0; i < EXTRA; i += 1) {
    all.splice(Math.floor((i + 1) * all.length / (EXTRA + 1)), 0, { id: `mockfile${String(i).padStart(6, '0')}AbC`, name: i % 2 ? `notes ${i}.txt` : `cover ${i}.jpg` });
  }

  const scroller = document.getElementById('scroller');
  const spacer = document.getElementById('spacer');
  const stats = document.getElementById('stats');
  let loaded = Math.min(BATCH, all.length);
  let loading = false;
  let renderTimer = 0;
  window.__mockDrive = { get loaded() { return loaded; }, total: all.length, media: TOTAL, loads: 0 };

  function render() {
    spacer.style.height = `${(loaded + (loading && SPINNER ? 1 : 0)) * ROW_H}px`;
    const first = VIRTUAL ? Math.max(0, Math.floor(scroller.scrollTop / ROW_H) - 10) : 0;
    const last = VIRTUAL ? Math.min(loaded, Math.ceil((scroller.scrollTop + scroller.clientHeight) / ROW_H) + 10) : loaded;
    const nodes = [];
    for (let i = first; i < last; i += 1) {
      const item = all[i];
      const row = document.createElement('div');
      row.setAttribute('role', 'row');
      row.dataset.id = item.id;
      row.style.top = `${i * ROW_H}px`;
      const cell = document.createElement('div');
      cell.setAttribute('role', 'gridcell');
      const span = document.createElement('span');
      span.textContent = item.name;
      cell.appendChild(span);
      row.appendChild(cell);
      nodes.push(row);
    }
    if (loading && SPINNER) {
      const spin = document.createElement('div');
      spin.setAttribute('role', 'progressbar');
      spin.style.top = `${loaded * ROW_H}px`;
      spin.textContent = 'Loading…';
      nodes.push(spin);
    }
    spacer.replaceChildren(...nodes);
    stats.textContent = `mock: loaded ${loaded}/${all.length} rows · batch ${BATCH} · delay ${DELAY_MIN}-${DELAY_MAX}ms`;
  }

  function maybeLoadMore() {
    if (loading || loaded >= all.length) return;
    if (scroller.scrollTop + scroller.clientHeight < scroller.scrollHeight - 200) return;
    loading = true;
    render();
    const delay = DELAY_MIN + Math.random() * (DELAY_MAX - DELAY_MIN);
    setTimeout(() => {
      loaded = Math.min(all.length, loaded + BATCH);
      loading = false;
      window.__mockDrive.loads += 1;
      render();
    }, delay);
  }

  scroller.addEventListener('scroll', () => {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => { if (VIRTUAL) render(); maybeLoadMore(); }, RENDER_DELAY);
  });
  render();

  // Fake audio: rewrite drive.usercontent download URLs to generated WAV tones.
  function wavUrl(freq, seconds = 20) {
    const rate = 8000;
    const n = rate * seconds;
    const buffer = new ArrayBuffer(44 + n * 2);
    const view = new DataView(buffer);
    const str = (offset, s) => [...s].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
    str(0, 'RIFF'); view.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt ');
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    str(36, 'data'); view.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i += 1) view.setInt16(44 + i * 2, Math.sin(2 * Math.PI * freq * i / rate) * 3000 * Math.min(1, (n - i) / 800), true);
    return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
  }
  const tones = [262, 330, 392, 523].map(f => wavUrl(f));
  const srcDescriptor = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'src');
  Object.defineProperty(HTMLMediaElement.prototype, 'src', {
    configurable: true,
    get() { return srcDescriptor.get.call(this); },
    set(value) {
      const match = String(value).match(/drive\.usercontent\.google\.com\/download\?id=([^&]+)/);
      if (match) {
        const id = decodeURIComponent(match[1]);
        value = id.includes('X') ? '/dev/mock-drive/missing-file.wav' : tones[Number(id.replace(/\D/g, '')) % tones.length];
      }
      srcDescriptor.set.call(this, value);
    }
  });

  const script = document.createElement('script');
  script.src = params.get('script') || '/google-drive-folder-player.user.js';
  document.body.appendChild(script);
})();
</script>
</body>
</html>
